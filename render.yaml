# Render blueprint: one Docker web service running API + UI (docker/start.sh).
# Database: create a free Postgres (Neon / Supabase), run the loader against it once from your laptop,
# then paste the READ-ONLY connection string below as DATABASE_URL_RO.
services:
  - type: web
    name: ipl-insights
    runtime: docker
    plan: free
    healthCheckPath: /_stcore/health
    envVars:
      - { key: DATABASE_URL_RO, sync: false }
      - { key: LLM_PROVIDER, value: groq }
      - { key: LLM_MODEL, sync: false }
      - { key: GROQ_API_KEY, sync: false }
      - { key: RATE_LIMIT_PER_MIN, value: "6" }
      - { key: DAILY_ASK_CAP, value: "300" }
